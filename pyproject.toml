[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canonical-model-generator"
version = "0.1.0"
description = "Deterministic discovery tooling for regional .NET APIs"
requires-python = ">=3.12"
dependencies = [
  "chromadb==1.5.9",
  "langgraph==1.2.12",
  "openai==3.19.1",
  "openpyxl==3.1.5",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "PyYAML==6.0.3",
  "streamlit==1.62.0",
  "tiktoken==0.12.0",
  "sentence-transformers==6.1.0",
  "torch==2.14.0",
  "transformers==5.17.0",
]

[project.scripts]
canonical-discovery = "canonical_model_generator.cli:main"
canonical-rag = "canonical_model_generator.repository_rag.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
